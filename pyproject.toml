[build-system]
requires = ["setuptools>=45,<75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "odoo-rest-api"
version = "0.3.0"
description = "Decorator-based REST API framework for Odoo modules"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "LGPL-3.0-or-later" }
authors = [{ name = "Mohammed Farhan KC", email = "kcfarhan123@gmail.com" }]
keywords = [
    "odoo",
    "rest",
    "api",
    "framework",
    "decorator",
    "odoo-api",
    "odoo-rest",
    "pydantic",
    "swagger",
    "openapi",
    "validation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Framework :: Odoo",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = []

[tool.setuptools.packages.find]
include = ["odoo_rest_api"]

[project.optional-dependencies]
pydantic = ["pydantic>=1.10"]
dev = ["pytest", "pydantic>=1.10"]

[project.urls]
Homepage = "https://github.com/mdfarhankc/odoo-rest-api"
Repository = "https://github.com/mdfarhankc/odoo-rest-api"
Issues = "https://github.com/mdfarhankc/odoo-rest-api/issues"
